[package]
name = "lightsim-core"
description = "lightsim: GPU-first FDTD electromagnetic solver — core model, compiler and CPU reference engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# tells dependent build scripts the precision (DEP_LIGHTSIM_CORE_PRECISION)
links = "lightsim_core"

[features]
default = []
# Adjoints of the per-cell material updates generated by Rust's Enzyme-based
# `std::autodiff` (`#[autodiff_reverse]`). Needs a nightly toolchain with the
# `enzyme-preview` component, `-Zautodiff=Enable` and fat LTO; see
# scripts/test_enzyme.sh and docs/modules/autodiff.md.
enzyme = []
# Double precision: fields, coefficients and stored results in f64 (the
# `Real` type) instead of f32. CPU only: lightsim-cuda does not build against
# it. See docs/guide/install.md ("Precision").
f64 = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
anyhow.workspace = true
thiserror.workspace = true
num-complex.workspace = true
log.workspace = true

[dev-dependencies]
approx = "0.5"
