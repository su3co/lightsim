[package]
name = "lightsim-py"
description = "Python bindings for lightsim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = []
cuda = ["dep:lightsim-cuda", "dep:cuda-core"]
# Double precision on the CPU (lightsim-core/f64), arrays in float64; cannot
# be combined with cuda.
f64 = ["lightsim-core/f64"]

[dependencies]
lightsim-core = { path = "../lightsim-core" }
lightsim-cuda = { path = "../lightsim-cuda", optional = true }
cuda-core = { workspace = true, optional = true }
anyhow.workspace = true
serde_json.workspace = true
num-complex.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
