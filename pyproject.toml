[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lightsim"
# The version is set in one place, [workspace.package] in Cargo.toml; maturin
# copies it here (see RELEASING.md).
dynamic = ["version"]
description = "Rust-native simulation engine for photonic chips: FDTD on GPUs, mode solvers, eigenmode expansion, finite elements, circuits and inverse design, with a Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SU3 Labs" }]
keywords = [
    "fdtd",
    "electromagnetics",
    "maxwell",
    "photonics",
    "simulation",
    "gpu",
    "cuda",
    "gdsfactory",
    "inverse-design",
    "adjoint",
    "mode-solver",
    "eigenmode-expansion",
    "finite-elements",
    "photonic-integrated-circuits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gds = ["gdsfactory>=8"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7", "gdsfactory>=8", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://su3labs.com/lightsim/"
Documentation = "https://su3labs.com/lightsim/docs/"
Repository = "https://github.com/su3co/lightsim"
Issues = "https://github.com/su3co/lightsim/issues"

[tool.maturin]
python-source = "python"
module-name = "lightsim._core"
manifest-path = "crates/lightsim-py/Cargo.toml"
# drop the debug info of the release profile from the extension module
strip = true
# The sdist holds only the crates the default build needs; lightsim-cuda is an
# optional path dependency, which cargo must still find to resolve the
# workspace (and which a source build with --features cuda compiles; its
# kernels are the committed PTX, so no kernel compiler is needed).
include = [{ path = "crates/lightsim-cuda/**/*", format = "sdist" }]
# Wheels built with --locked use exactly the dependency versions of Cargo.lock.
# GPU support: maturin build --release --features cuda (see docs/guide/install.md);
# the published Linux wheels are built that way, the macOS wheels without it.
