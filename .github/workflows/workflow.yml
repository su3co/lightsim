# Wheels, sdist and PyPI publication.
#
# Every pull request and push to main builds the wheels and the sdist, installs
# each one in a clean environment on its own platform and runs a fast CPU test.
# A pushed tag v<version> does the same and then publishes to PyPI through
# trusted publishing (OpenID Connect, no stored token) from the `pypi`
# environment. See RELEASING.md.
#
# To add a platform (Windows, for example), add an entry to the matrix of a
# build job and to the matching test job.

name: wheels

on:
  pull_request:
  push:
    branches: [main, ci-wheels]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push replaces an older run; a release run is never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MATURIN_VERSION: "1.16.0"
  PYTHONUNBUFFERED: "1"

jobs:
  # ------------------------------------------------------------------ builds

  linux:
    name: build linux ${{ matrix.arch }} (CUDA)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel (manylinux_2_28, --features cuda)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.arch }}-unknown-linux-gnu
          manylinux: "2_28"
          args: --release --locked --features cuda --out dist
          sccache: "true"
          # CUDA headers and libclang for the bindings generator; they are
          # not shipped in the wheel (the driver is loaded at run time)
          before-script-linux: |
            eval "$(bash .github/scripts/install-cuda-headers.sh)"
            echo "CUDA_TOOLKIT_PATH=$CUDA_TOOLKIT_PATH LIBCLANG_PATH=$LIBCLANG_PATH"
      - name: Wheel contents
        run: |
          ls -l dist
          unzip -l dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: build macos ${{ matrix.arch }} (CPU)
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            deployment: "11.0"
          - arch: x86_64
            target: x86_64-apple-darwin
            deployment: "10.13"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml) and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install "maturin==${MATURIN_VERSION}"
          maturin build --release --locked --target ${{ matrix.target }} --out dist
          ls -l dist
          unzip -l dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: build sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install "maturin==${MATURIN_VERSION}"
          maturin sdist --out dist
          ls -l dist
          tar tzf dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------- tests
  # Each wheel is installed in a fresh virtual environment, outside the source
  # tree, on a runner with no NVIDIA driver; the tests run on the CPU.

  test-linux:
    name: test linux ${{ matrix.arch }} py${{ matrix.python }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        python: ["3.10", "3.14"]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect the wheel (auditwheel, dynamic section, GPU backend present)
        if: matrix.python == '3.10'
        run: |
          python -m pip install -q "auditwheel==6.4.2"
          auditwheel show dist/*.whl
          mkdir -p /tmp/whl && cd /tmp/whl && unzip -q "$GITHUB_WORKSPACE"/dist/*.whl
          so=$(ls lightsim/_core*.so)
          readelf -d "$so" | grep NEEDED
          # the CUDA backend is compiled in: the PTX kernels are embedded
          grep -c "\.target sm_80" "$so"
          test -z "$(find . -name 'libcu*')"
      - name: Confirm the runner has no NVIDIA driver
        run: |
          ! ldconfig -p | grep -q libcuda.so
      - &install_and_test
        name: Install in a clean environment and test
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install -q dist/*.whl pytest
          cp -r python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/.github/scripts/smoke_test.py"
          python -m pytest tests -q -p no:cacheprovider --durations=60

  test-macos:
    name: test macos ${{ matrix.arch }} py${{ matrix.python }}
    needs: macos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        python: ["3.10", "3.14"]
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - *install_and_test

  test-sdist:
    name: test sdist (source build, Rust only)
    needs: sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rust (stable, nothing else) and no CUDA
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          ! command -v nvcc
      - name: pip install from the sdist in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          cd "$RUNNER_TEMP"
          python -m pip install -v "$GITHUB_WORKSPACE"/dist/*.tar.gz 2>&1 | grep -E "Compiling lightsim|Finished|Successfully|error" || true
          python -m pip show lightsim
          python "$GITHUB_WORKSPACE/.github/scripts/smoke_test.py"

  # ----------------------------------------------------------------- release

  version:
    name: check tag against version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from Cargo.toml (the only place it is set)
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(f"package version {version}")
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              assert tag == f"v{version}", f"tag {tag} does not match the package version {version} (expected v{version})"
              print(f"tag {tag} matches")

  publish:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, test-linux, test-macos, test-sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/lightsim/
    permissions:
      id-token: write # trusted publishing; no other permission and no secret
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - name: Every file carries the tag's version
        run: |
          ls -l dist
          v="${GITHUB_REF_NAME#v}"
          test "$(ls dist | wc -l)" -ge 5
          ! ls dist | grep -v "^lightsim-${v}[-.]"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
