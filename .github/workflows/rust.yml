# Rust checks that fit free runners: clippy on the crates that build without
# CUDA (warnings are reported, errors fail) and every test of lightsim-core on
# the CPU (about 6 minutes on a 4-core runner, the physics validation cases
# included). The CUDA crate's tests and the GPU validation need NVIDIA GPUs
# and are run by hand (docs/validation.md). There is no rustfmt check: the
# code base is not rustfmt-formatted. Publishing lives only in workflow.yml.

name: rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy (CPU crates)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked -p lightsim-core -p lightsim-cli -p lightsim-py --all-targets

  test-core:
    name: cargo test lightsim-core (CPU)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p lightsim-core --no-run
      - run: cargo test --locked -p lightsim-core
